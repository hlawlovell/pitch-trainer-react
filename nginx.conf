server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location ~* \.(js|css|mp3|svg|png|jpg)$ {
    expires 7d;
  }
  # YouTube -> UltraStar converter: kengine (engine/start-kengine.cmd, runs on Windows for the GPU) at
  # host.docker.internal:8002; if it isn't running, the Docker converter (UltraSinger) answers instead.
  # Resolved per request, so the app still starts when neither is up.
  # ^~ so the static-file rule above (.mp3/.jpg) never catches converter downloads
  location ^~ /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kengine http://host.docker.internal:8002;
    proxy_pass $kengine;
    proxy_connect_timeout 2s;
    proxy_read_timeout 120s;
    proxy_buffering off;
    error_page 502 504 = @converter;
  }
  location @converter {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $converter http://converter:8000;
    proxy_pass $converter;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
}
